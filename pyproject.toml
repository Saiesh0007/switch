[project]
name = "counterpart"
version = "0.1.0"
description = "AI agents negotiate contracts across a trust boundary, in Switch rooms, with humans holding the authority."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "websockets>=13", "pyyaml>=6", "pydantic>=2"]

[project.optional-dependencies]
claude = ["anthropic>=0.60"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["counterpart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
